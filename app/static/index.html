<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Code Review Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0B0F17;
  --panel: #111827;
  --panel-border: #1F2937;
  --panel-subtle: #161F30;
  --ink: #F3F4F6;
  --muted: #9CA3AF;
  --line: #263346;
  
  --brand: #3B82F6;
  --brand-hover: #2563EB;
  --brand-glow: rgba(59, 130, 246, 0.15);
  
  --bug: #EF4444;
  --bug-bg: rgba(239, 68, 68, 0.12);
  --bug-border: rgba(239, 68, 68, 0.3);
  
  --style: #F59E0B;
  --style-bg: rgba(245, 158, 11, 0.12);
  --style-border: rgba(245, 158, 11, 0.3);
  
  --bp: #10B981;
  --bp-bg: rgba(16, 185, 129, 0.12);
  --bp-border: rgba(16, 185, 129, 0.3);

  --mono: 'JetBrains Mono', ui-monospace, Menlo, Monaco, Consolas, monospace;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; transition: all 0.15s ease; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* auth */
.auth { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 20%, #1E293B 0%, #0B0F17 100%); }
.auth-card {
  width: 100%; max-width: 400px;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 12px;
  padding: 36px 32px;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
}
.brand { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; color: #FFF; }
.brand span { color: var(--brand); }
.brand-icon { width: 22px; height: 22px; background: var(--brand); border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 800; }
.auth-card h1 { font-size: 22px; margin: 24px 0 6px; font-weight: 700; color: #FFF; letter-spacing: -0.02em; }
.auth-card p { margin: 0 0 24px; color: var(--muted); font-size: 13.5px; }
label { display: block; font-weight: 500; font-size: 13px; margin: 16px 0 6px; color: #E5E7EB; }
input, select {
  width: 100%; padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel-subtle);
  color: #FFF;
  font-size: 14px;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
input:focus, select:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-glow);
  outline: none;
}
.btn {
  border: 0; border-radius: 8px;
  padding: 10px 18px; font-weight: 600;
  background: var(--brand); color: #FFF;
  box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
}
.btn:hover { background: var(--brand-hover); }
.btn:disabled { opacity: 0.6; cursor: wait; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.ghost:hover { background: var(--panel-subtle); border-color: var(--muted); }
.btn.block { width: 100%; margin-top: 24px; padding: 11px; }
.link { background: none; border: 0; color: var(--brand); padding: 0; font-weight: 600; }
.link:hover { text-decoration: underline; }
.err { color: var(--bug); min-height: 20px; margin-top: 12px; font-size: 13px; }
.switch { margin-top: 18px; color: var(--muted); font-size: 13px; text-align: center; }

/* app shell */
header {
  height: 58px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; background: var(--panel); border-bottom: 1px solid var(--panel-border);
}
.who { display: flex; gap: 16px; align-items: center; color: var(--muted); font-size: 13.5px; }
.shell { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 58px); }
aside { background: #0E131F; border-right: 1px solid var(--panel-border); display: flex; flex-direction: column; min-height: 0; }
aside .top { padding: 16px 18px; border-bottom: 1px solid var(--panel-border); display: flex; justify-content: space-between; align-items: center; }
aside h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0; }
#history { list-style: none; margin: 0; padding: 8px; overflow-y: auto; flex: 1; }
#history li {
  padding: 12px 14px; border-radius: 8px; cursor: pointer;
  display: grid; grid-template-columns: 1fr auto; gap: 4px 10px;
  margin-bottom: 4px; border: 1px solid transparent;
  transition: all 0.15s ease;
}
#history li:hover { background: var(--panel-subtle); border-color: var(--line); }
#history li.on { background: rgba(59, 130, 246, 0.12); border-color: rgba(59, 130, 246, 0.3); }
#history .sum { grid-column: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; color: #F3F4F6; font-size: 13.5px; }
#history .meta { grid-column: 1; color: var(--muted); font-size: 12px; }
#history .sc { grid-row: 1/3; grid-column: 2; align-self: center; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; padding: 2px 8px; border-radius: 6px; }
.sc.good { color: #34D399; background: rgba(16, 185, 129, 0.15); }
.sc.mid { color: #FBBF24; background: rgba(245, 158, 11, 0.15); }
.sc.bad { color: #F87171; background: rgba(239, 68, 68, 0.15); }
.empty-h { padding: 20px 16px; color: var(--muted); text-align: center; }

main { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; padding: 16px; min-height: 0; background: var(--bg); }
.pane { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
.bar { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--panel-border); background: var(--panel-subtle); }
.bar select { width: auto; padding: 6px 12px; font-size: 13px; font-weight: 500; }
.bar .grow { flex: 1; }
.bar strong { font-weight: 600; font-size: 14px; color: #FFF; }

/* code */
.code-wrap { flex: 1; display: flex; min-height: 0; font-family: var(--mono); font-size: 13px; line-height: 22px; background: #0B0F17; }
#gutter { margin: 0; padding: 14px 12px 14px 16px; text-align: right; color: #4B5563; background: #0E131F; border-right: 1px solid var(--panel-border); overflow: hidden; user-select: none; font-size: 12.5px; }
#code { flex: 1; border: 0; resize: none; outline: 0; padding: 14px; white-space: pre; overflow: auto; font: inherit; line-height: inherit; tab-size: 4; background: transparent; color: #E5E7EB; }
#annotated { flex: 1; overflow: auto; padding: 14px 0; background: #0B0F17; }
.row { display: grid; grid-template-columns: 46px 3px 1fr; min-height: 22px; }
.row .no { text-align: right; padding-right: 12px; color: #4B5563; user-select: none; font-size: 12.5px; }
.row code { white-space: pre; padding-left: 12px; font: inherit; color: #E5E7EB; }
.row.f-bug { background: var(--bug-bg); } .row.f-bug .bar4 { background: var(--bug); }
.row.f-style { background: var(--style-bg); } .row.f-style .bar4 { background: var(--style); }
.row.f-best_practice { background: var(--bp-bg); } .row.f-best_practice .bar4 { background: var(--bp); }
.row.pulse { outline: 2px solid var(--brand); outline-offset: -2px; background: rgba(59, 130, 246, 0.2) !important; }
.row.f-bug, .row.f-style, .row.f-best_practice { cursor: pointer; }

/* result */
#result { overflow-y: auto; flex: 1; padding: 20px; }
.placeholder { color: var(--muted); max-width: 320px; margin: 60px auto; text-align: center; }
.placeholder b { display: block; color: #FFF; font-size: 16px; margin-bottom: 8px; font-weight: 600; }
.head { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--panel-border); }
.big { font-size: 38px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; color: #FFF; }
.big small { font-size: 14px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.counts { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.chip.bug { background: var(--bug-bg); color: #F87171; border: 1px solid var(--bug-border); }
.chip.style { background: var(--style-bg); color: #FBBF24; border: 1px solid var(--style-border); }
.chip.best_practice { background: var(--bp-bg); color: #34D399; border: 1px solid var(--bp-border); }
.summary { margin: 0 0 20px; color: #D1D5DB; font-size: 14px; line-height: 1.6; }
.finding { border: 1px solid var(--panel-border); border-left: 4px solid; border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; cursor: pointer; background: var(--panel-subtle); transition: transform 0.1s ease, border-color 0.15s ease; }
.finding:hover { border-color: #374151; transform: translateY(-1px); }
.finding.bug { border-left-color: var(--bug); }
.finding.style { border-left-color: var(--style); }
.finding.best_practice { border-left-color: var(--bp); }
.finding h3 { margin: 0 0 6px; font-size: 14px; font-weight: 600; color: #FFF; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tag { font-size: 11.5px; font-weight: 600; color: var(--muted); background: var(--bg); padding: 2px 8px; border-radius: 4px; text-transform: capitalize; }
.finding p { margin: 0 0 10px; color: #9CA3AF; font-size: 13.5px; line-height: 1.5; }
.fix { font-family: var(--mono); font-size: 12px; background: #0B0F17; border: 1px solid var(--panel-border); border-radius: 6px; padding: 8px 12px; display: block; color: #34D399; overflow-x: auto; }
.meta-foot { color: var(--muted); font-size: 12px; margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--panel-border); display: flex; justify-content: space-between; }
@media(max-width:900px){.shell{grid-template-columns:1fr;height:auto}aside{max-height:220px}main{grid-template-columns:1fr}.pane{min-height:420px}}
</style>
</head>
<body>

<section class="auth" id="auth">
  <div class="auth-card">
    <div class="brand"><div class="brand-icon">AI</div>Code<span>Review</span></div>
    <h1 id="auth-title">Sign in</h1>
    <p id="auth-sub">Your reviews are saved to your own history.</p>
    <label for="email">Email address</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="At least 8 characters">
    <div class="err" id="auth-err" role="alert"></div>
    <button class="btn block" id="auth-btn">Sign in</button>
    <div class="switch"><span id="switch-text">New here?</span> <button class="link" id="switch-btn">Create an account</button></div>
  </div>
</section>

<div id="app" hidden>
  <header>
    <div class="brand"><div class="brand-icon">AI</div>Code<span>Review</span></div>
    <div class="who"><span id="who"></span><button class="btn ghost" id="logout">Sign out</button></div>
  </header>
  <div class="shell">
    <aside>
      <div class="top"><h2>Review history</h2><button class="btn ghost" id="new">+ New</button></div>
      <ul id="history"></ul>
    </aside>
    <main>
      <section class="pane">
        <div class="bar">
          <select id="lang" aria-label="Language">
            <option>python</option><option>javascript</option><option>typescript</option>
            <option>java</option><option>go</option><option>rust</option><option>c++</option><option>sql</option>
          </select>
          <span class="grow"></span>
          <button class="btn ghost" id="edit" hidden>Edit code</button>
          <button class="btn" id="run">Review code</button>
        </div>
        <div class="code-wrap" id="editor">
          <pre id="gutter">1</pre>
          <textarea id="code" wrap="off" spellcheck="false" placeholder="Paste the code you want reviewed"></textarea>
        </div>
        <div id="annotated" class="code-wrap" hidden style="display:block"></div>
      </section>
      <section class="pane">
        <div class="bar"><strong>Feedback</strong><button class="btn ghost" id="del" hidden>Delete review</button></div>
        <div id="result"></div>
      </section>
    </main>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LABEL = {bug:'Bug', style:'Style', best_practice:'Best practice'};
const SEV = {high:3, medium:2, low:1};
let token = localStorage.getItem('token'), mode = 'login', current = null;

async function api(path, opts = {}) {
  const headers = {...(opts.headers || {})};
  if (token) headers.Authorization = 'Bearer ' + token;
  if (opts.json) { headers['Content-Type'] = 'application/json'; opts = {...opts, body: JSON.stringify(opts.json)}; }
  const res = await fetch('/api' + path, {...opts, headers});
  if (res.status === 401 && token) { logout(); throw new Error('Session expired. Sign in again.'); }
  if (!res.ok) {
    let d; try { d = (await res.json()).detail; } catch {}
    throw new Error(typeof d === 'string' ? d : 'Check the fields and try again.');
  }
  return res.status === 204 ? null : res.json();
}

/* ---------- auth ---------- */
function setMode(m) {
  mode = m;
  const reg = m === 'register';
  $('#auth-title').textContent = reg ? 'Create your account' : 'Sign in';
  $('#auth-btn').textContent = reg ? 'Create account' : 'Sign in';
  $('#switch-text').textContent = reg ? 'Already have an account?' : 'New here?';
  $('#switch-btn').textContent = reg ? 'Sign in' : 'Create an account';
  $('#auth-err').textContent = '';
}
async function submitAuth() {
  const email = $('#email').value.trim(), password = $('#password').value;
  $('#auth-err').textContent = '';
  token = null;
  try {
    if (mode === 'register') await api('/auth/register', {method:'POST', json:{email, password}});
    const data = await api('/auth/login', {method:'POST', body:new URLSearchParams({username:email, password})});
    token = data.access_token; localStorage.setItem('token', token);
    await boot();
  } catch (e) { $('#auth-err').textContent = e.message; }
}
function logout() {
  token = null; localStorage.removeItem('token');
  $('#app').hidden = true; $('#auth').hidden = false;
}
async function boot() {
  if (!token) return logout();
  try {
    const me = await api('/auth/me');
    $('#who').textContent = me.email;
    $('#auth').hidden = true; $('#app').hidden = false;
    await loadHistory(); newReview();
  } catch { logout(); }
}

/* ---------- history ---------- */
const scoreClass = n => n >= 75 ? 'good' : n >= 50 ? 'mid' : 'bad';
async function loadHistory() {
  const items = await api('/reviews');
  const ul = $('#history');
  if (!items.length) { ul.innerHTML = '<li class="empty-h" style="cursor:default">No reviews yet. Paste some code and run your first review.</li>'; return; }
  ul.innerHTML = items.map(r => `
    <li data-id="${r.id}" class="${r.id === current?.id ? 'on' : ''}">
      <span class="sum">${esc(r.summary)}</span>
      <span class="sc ${scoreClass(r.score)}">${r.score}</span>
      <span class="meta">${esc(r.language)} · ${r.findings_count} finding${r.findings_count === 1 ? '' : 's'} · ${new Date(r.created_at).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span>
    </li>`).join('');
}
$('#history').addEventListener('click', async e => {
  const li = e.target.closest('li[data-id]'); if (!li) return;
  try { show(await api('/reviews/' + li.dataset.id)); loadHistory(); } catch (err) { alert(err.message); }
});

/* ---------- editor ---------- */
const ta = $('#code'), gutter = $('#gutter');
function syncGutter() {
  gutter.textContent = Array.from({length: ta.value.split('\n').length}, (_, i) => i + 1).join('\n');
  gutter.scrollTop = ta.scrollTop;
}
ta.addEventListener('input', syncGutter);
ta.addEventListener('scroll', () => gutter.scrollTop = ta.scrollTop);

function newReview() {
  current = null; ta.value = ''; syncGutter();
  $('#editor').hidden = false; $('#annotated').hidden = true; $('#edit').hidden = true; $('#del').hidden = true;
  $('#run').hidden = false;
  $('#result').innerHTML = '<div class="placeholder"><b>Nothing reviewed yet</b>Paste code on the left and select Review code. Findings appear here, tied to the lines they affect.</div>';
  loadHistory();
}
function editCode() {
  ta.value = current.code; syncGutter();
  $('#editor').hidden = false; $('#annotated').hidden = true; $('#edit').hidden = true; $('#run').hidden = false;
}

async function runReview() {
  const code = ta.value;
  if (!code.trim()) { $('#result').innerHTML = '<div class="placeholder"><b>No code to review</b>Paste some code first.</div>'; return; }
  const btn = $('#run'); btn.disabled = true; btn.textContent = 'Reviewing…';
  try {
    const review = await api('/reviews', {method:'POST', json:{code, language:$('#lang').value}});
    show(review); loadHistory();
  } catch (e) {
    $('#result').innerHTML = `<div class="placeholder"><b>Review failed</b>${esc(e.message)}</div>`;
  } finally { btn.disabled = false; btn.textContent = 'Review code'; }
}

/* ---------- render review ---------- */
function show(review) {
  current = review;
  const {findings, summary, score} = review.feedback;
  $('#lang').value = review.language;
  $('#editor').hidden = true; $('#run').hidden = true; $('#edit').hidden = false; $('#del').hidden = false;

  const top = {};
  findings.forEach(f => { if (f.line && (!top[f.line] || SEV[f.severity] > SEV[top[f.line].severity])) top[f.line] = f; });
  const box = $('#annotated'); box.hidden = false;
  box.innerHTML = review.code.split('\n').map((l, i) => {
    const f = top[i + 1];
    return `<div class="row ${f ? 'f-' + f.category : ''}" data-line="${i + 1}"><span class="no">${i + 1}</span><span class="bar4"></span><code>${esc(l)}</code></div>`;
  }).join('');

  const counts = {};
  findings.forEach(f => counts[f.category] = (counts[f.category] || 0) + 1);
  const sorted = [...findings].sort((a, b) => (a.line ?? 1e9) - (b.line ?? 1e9));
  $('#result').innerHTML = `
    <div class="head"><div class="big">${score}<small> / 100</small></div>
      <div class="counts">${Object.entries(counts).map(([k, n]) => `<span class="chip ${k}">${n} ${({bug:'bug',style:'style issue',best_practice:'best practice'})[k]}${n > 1 ? 's' : ''}</span>`).join('') || '<span class="chip best_practice">No issues</span>'}</div></div>
    <p class="summary">${esc(summary)}</p>
    ${sorted.map(f => `
      <article class="finding ${f.category}" data-line="${f.line ?? ''}">
        <h3>${esc(f.title)} <span class="tag">${LABEL[f.category]} · ${f.severity} severity${f.line ? ' · line ' + f.line : ''}</span></h3>
        <p>${esc(f.explanation)}</p><code class="fix">${esc(f.suggestion)}</code>
      </article>`).join('')}
    <div class="meta-foot"><span>Reviewed by ${esc(review.model)}</span><span>${new Date(review.created_at).toLocaleString()}</span></div>`;
}
function pulse(line) {
  const row = $(`.row[data-line="${line}"]`); if (!row) return;
  row.scrollIntoView({block:'center', behavior:'smooth'});
  row.classList.add('pulse'); setTimeout(() => row.classList.remove('pulse'), 1400);
}
$('#result').addEventListener('click', e => { const f = e.target.closest('.finding'); if (f?.dataset.line) pulse(f.dataset.line); });
$('#annotated').addEventListener('click', e => {
  const row = e.target.closest('.row'); if (!row) return;
  const card = $(`.finding[data-line="${row.dataset.line}"]`);
  if (card) card.scrollIntoView({block:'center', behavior:'smooth'});
});

/* ---------- wiring ---------- */
$('#auth-btn').onclick = submitAuth;
$('#password').addEventListener('keydown', e => e.key === 'Enter' && submitAuth());
$('#switch-btn').onclick = () => setMode(mode === 'login' ? 'register' : 'login');
$('#logout').onclick = logout;
$('#new').onclick = newReview;
$('#edit').onclick = editCode;
$('#run').onclick = runReview;
$('#del').onclick = async () => {
  if (!current || !confirm('Delete this review?')) return;
  await api('/reviews/' + current.id, {method:'DELETE'}); newReview();
};
boot();
</script>
</body>
</html>
